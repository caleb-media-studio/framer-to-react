name: Bug report
description: Report a reproducible capture, compiler or rendering issue
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal synthetic archive or steps. Do not attach private projects.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version and runtime
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized diagnostics
    validations:
      required: true

